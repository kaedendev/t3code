<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Orbital Sunrise: deep space over a planet limb, city lights on the night side and the
       sun cresting bottom-right. No filters: Icon Composer ignores them. -->
  <defs>
    <linearGradient id="sky" x1="64" y1="0" x2="64" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#000000"/>
      <stop offset="0.3" stop-color="#010306"/>
      <stop offset="0.55" stop-color="#030616"/>
      <stop offset="0.83" stop-color="#0E1B4C"/>
      <stop offset="0.92" stop-color="#1B3484"/>
      <stop offset="1" stop-color="#2A5CD2"/>
    </linearGradient>
    <radialGradient id="milkyWay" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(78 40) rotate(-28) scale(70 11)">
      <stop stop-color="#B9C6FF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#B9C6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dawn" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(102 110) scale(60 30)">
      <stop stop-color="#FFE2B0" stop-opacity="1"/>
      <stop offset="0.14" stop-color="#FF9F5A" stop-opacity="0.66"/>
      <stop offset="0.45" stop-color="#9A5CC0" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#5A3AA8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="planet" x1="64" y1="104" x2="64" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1230"/>
      <stop offset="1" stop-color="#04060F"/>
    </linearGradient>
    <radialGradient id="sun" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(102 110) scale(4.4 2.2)">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#FFF1D2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFD08A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="limbWarm" x1="40" y1="0" x2="128" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB070" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#FFB070" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FF9A50" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="flare" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(102 110) scale(11 1.3)">
      <stop stop-color="#FFF4DC" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#FFD9A0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFB070" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect width="128" height="128" rx="10"/>
    </clipPath>
  </defs>

